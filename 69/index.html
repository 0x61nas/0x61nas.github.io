<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sixty-Nine</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: white;
      }

      p {
        display: inline-block;
        font-size: 20vw;
        animation: spin 5s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
  </style>
  </head>
  <body>
    <center>
      <p>69</p>
    </center>
  </body>
</html>
